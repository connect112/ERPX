name: ERPX CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erpx
          POSTGRES_PASSWORD: erpx_secret
          POSTGRES_DB: erpx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erpx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://erpx:erpx_secret@localhost:5432/erpx_test
          # alembic/env.py imports the top-level `modules` package, which lives at the repository root, not under apps/api.
          PYTHONPATH: ${{ github.workspace }}
        run: alembic upgrade head

      # The hackathon tests expect the default roles and permissions (for example `hackathon_participant`) to exist already; a fresh
      # CI database has none until they are seeded. Only the roles seed is run: scripts.seed also creates the Pentrix organisation,
      # which these tests do not need.
      - name: Seed default roles and permissions
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://erpx:erpx_secret@localhost:5432/erpx_test
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import asyncio; from scripts.seed import seed_rbac; asyncio.run(seed_rbac())"

      # Object storage for the tests that store files (media, documents, expense claims, backups, certificates ...).
      # MinIO no longer publishes container images or binaries (Docker Hub denies the image; dl.min.io answers 410 Gone), so it is built
      # from its public source, pinned to the exact commit the project's servers run (RELEASE.2025-09-07T16-13-09Z). The compiled
      # binary is cached, so the build only happens when the pinned commit changes. The throwaway credentials below exist only for this job.
      - name: Set up Go (to build MinIO)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Cache the MinIO binary
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio-bin
          key: minio-07c3a429bfed433e49018cb0f78a52145d4bedeb-go1.24-linux-amd64

      - name: Build MinIO from source (pinned commit)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/minio-bin" go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb

      - name: Start MinIO
        env:
          MINIO_ROOT_USER: ci_minio_user
          MINIO_ROOT_PASSWORD: ci_minio_password
        run: |
          "$HOME/minio-bin/minio" --version
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup "$HOME/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address ":9000" > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready > /dev/null; then echo "MinIO is ready"; exit 0; fi
            sleep 2
          done
          echo "MinIO did not become ready"; cat "$RUNNER_TEMP/minio.log"; exit 1

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://erpx:erpx_secret@localhost:5432/erpx_test
          REDIS_URL: redis://localhost:6379/0
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: ci_minio_user
          MINIO_SECRET_KEY: ci_minio_password
          MINIO_BUCKET: erpx-storage
          MINIO_SECURE: "false"
        run: pytest -v --cov=apps/api/app --cov=modules --cov=packages

      # Production Hardening Audit: no dependency vulnerability scanning
      # existed anywhere in CI. pip-audit's own JSON output carries no
      # severity field (verified directly against its actual schema), so
      # `|| true` here deliberately lets pip-audit's own exit code pass
      # through without failing the step — .github/scripts/pip_audit_severity_gate.py
      # is what actually gates the build, using OSV.dev's severity data
      # for pip-audit's reported GHSA aliases, so only Critical/High
      # findings fail CI; Low/Moderate/Unknown are reported, not blocking.
      - name: Dependency vulnerability scan (pip-audit)
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json -o ../../pip-audit-report.json || true

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Gate on Critical/High severity (pip-audit)
        run: python .github/scripts/pip_audit_severity_gate.py pip-audit-report.json

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Previously this job only covered apps/web — student-portal,
        # trainer-portal, and corporate-portal were never built, type-
        # checked, or tested in CI at all (Production Hardening Audit
        # finding #5). All four apps share the same build/test scripts.
        app: [web, student-portal, trainer-portal, corporate-portal]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Type check + build
        working-directory: apps/${{ matrix.app }}
        run: npm run build

      - name: Run frontend tests
        working-directory: apps/${{ matrix.app }}
        # Only apps/web has a "test" script today (see
        # docs/project-hardening-audit.md finding #8) — --if-present skips
        # the other three cleanly rather than failing on a missing script.
        run: npm run test --if-present

      # Production Hardening Audit: no dependency vulnerability scanning
      # existed anywhere in CI. Full report (all severities) captured as
      # an artifact first, non-blocking; the actual gate is npm's own
      # native `--audit-level=high`, which exits non-zero only for
      # high/critical findings, exactly matching the required threshold —
      # no custom severity parsing needed here, unlike pip-audit.
      - name: Dependency vulnerability report (npm audit, all severities)
        working-directory: apps/${{ matrix.app }}
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/npm-audit-report.json

      - name: Gate on Critical/High severity (npm audit)
        working-directory: apps/${{ matrix.app }}
        run: npm audit --audit-level=high
