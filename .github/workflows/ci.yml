name: ERPX CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Isolated object storage for the tests that upload, download, back up and inspect files. Throwaway values for a
      # container that exists only for this job; they match nothing outside it.
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: erpx_ci_minio
      MINIO_SECRET_KEY: erpx_ci_minio_secret
      MINIO_BUCKET: erpx-ci-tests
      MINIO_SECURE: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erpx
          POSTGRES_PASSWORD: erpx_secret
          POSTGRES_DB: erpx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erpx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      # The test database is `postgres:16` (production's server is 16 too). The runner image (Ubuntu 26.04) ships PostgreSQL 18
      # client tools, and Ubuntu's own archive has only `postgresql-client-18`. A `pg_restore` 17 or newer sends
      # `SET transaction_timeout = 0;` when it restores straight into a 16 server, which 16 rejects, so the compressed-archive
      # restore tests failed (and `pg_restore` 16 cannot read archives made by `pg_dump` 17 or newer). Version 16 of the tools
      # therefore comes from the PostgreSQL project's apt repository (PGDG) through its official setup script, and goes first
      # on PATH so the tests' bare `pg_dump`/`pg_restore`/`psql` are the 16 ones. Any failure here fails the job; nothing is skipped.
      - name: Use PostgreSQL 16 client tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          apt-cache policy postgresql-client-16
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-16
          test -x /usr/lib/postgresql/16/bin/pg_restore
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      # Permanent diagnostic: which client tools the tests will run and which server they talk to. The check fails the job if
      # the tools are not version 16, so the setup above cannot silently stop working.
      - name: Show PostgreSQL client and server versions
        env:
          PGPASSWORD: erpx_secret
        run: |
          set -euo pipefail
          for tool in pg_dump pg_restore psql; do echo "$tool -> $(command -v "$tool"): $("$tool" --version)"; done
          echo "server: $(psql -h 127.0.0.1 -U erpx -d erpx_test -Atc 'show server_version')"
          pg_dump --version | grep -q 'PostgreSQL) 16\.'
          pg_restore --version | grep -q 'PostgreSQL) 16\.'
          psql --version | grep -q 'PostgreSQL) 16\.'

      # A service container cannot be given the `server /data` command MinIO needs, so it is started here. MinIO no longer
      # publishes community images (minio/minio cannot be pulled); this is the maintained community build the Mac staging kit
      # also uses, pinned by the digest of its multi-arch image index (checked against the registry's manifest) so a re-pushed
      # tag cannot change what CI runs. To update it, look up the new index digest and check that the manifest hashes to it.
      - name: Start isolated MinIO
        run: |
          docker run -d --name erpx-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          # Wait for the server itself to report live and ready (curl retries a refused connection; no fixed sleep). If it
          # never does, show its log and fail the job here instead of letting the tests fail with confusing errors.
          if ! curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors \
              http://127.0.0.1:9000/minio/health/live \
            || ! curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
              http://127.0.0.1:9000/minio/health/ready; then
            docker logs erpx-ci-minio
            exit 1
          fi

      - name: Create the test bucket
        working-directory: apps/api
        run: |
          python - <<'PY'
          import os
          from minio import Minio

          client = Minio(
              os.environ["MINIO_ENDPOINT"],
              access_key=os.environ["MINIO_ACCESS_KEY"],
              secret_key=os.environ["MINIO_SECRET_KEY"],
              secure=False,
          )
          bucket = os.environ["MINIO_BUCKET"]
          if not client.bucket_exists(bucket):
              client.make_bucket(bucket)
          assert client.bucket_exists(bucket), f"bucket {bucket} was not created"
          print(f"bucket {bucket} ready")
          PY

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://erpx:erpx_secret@localhost:5432/erpx_test
          # alembic/env.py imports the top-level `modules` package; without the
          # repository root on the path the step dies with ModuleNotFoundError.
          PYTHONPATH: ${{ github.workspace }}
        run: alembic upgrade head

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://erpx:erpx_secret@localhost:5432/erpx_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v --cov=apps/api/app --cov=modules --cov=packages

      - name: Stop MinIO
        if: always()
        run: docker rm --force erpx-ci-minio || true

      # Production Hardening Audit: no dependency vulnerability scanning
      # existed anywhere in CI. pip-audit's own JSON output carries no
      # severity field (verified directly against its actual schema), so
      # `|| true` here deliberately lets pip-audit's own exit code pass
      # through without failing the step — .github/scripts/pip_audit_severity_gate.py
      # is what actually gates the build, using OSV.dev's severity data
      # for pip-audit's reported GHSA aliases, so only Critical/High
      # findings fail CI; Low/Moderate/Unknown are reported, not blocking.
      # `!cancelled()` keeps the vulnerability gate evaluating even when a test failed; without it a red test step would
      # silently skip the gate and hide its result. It still fails the job on Critical/High, exactly as before.
      - name: Dependency vulnerability scan (pip-audit)
        if: ${{ !cancelled() }}
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json -o ../../pip-audit-report.json || true

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Gate on Critical/High severity (pip-audit)
        if: ${{ !cancelled() }}
        run: python .github/scripts/pip_audit_severity_gate.py pip-audit-report.json

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Previously this job only covered apps/web — student-portal,
        # trainer-portal, and corporate-portal were never built, type-
        # checked, or tested in CI at all (Production Hardening Audit
        # finding #5). employee-portal was missing from this list too, so its
        # dependencies were never audited here. All five apps share the same
        # build/test/audit scripts.
        app: [web, student-portal, trainer-portal, corporate-portal, employee-portal]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Type check + build
        working-directory: apps/${{ matrix.app }}
        run: npm run build

      - name: Run frontend tests
        working-directory: apps/${{ matrix.app }}
        # Only apps/web has a "test" script today (see
        # docs/project-hardening-audit.md finding #8) — --if-present skips
        # the other three cleanly rather than failing on a missing script.
        run: npm run test --if-present

      # Production Hardening Audit: no dependency vulnerability scanning
      # existed anywhere in CI. Full report (all severities) captured as
      # an artifact first, non-blocking; the actual gate is npm's own
      # native `--audit-level=high`, which exits non-zero only for
      # high/critical findings, exactly matching the required threshold —
      # no custom severity parsing needed here, unlike pip-audit.
      - name: Dependency vulnerability report (npm audit, all severities)
        working-directory: apps/${{ matrix.app }}
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/npm-audit-report.json

      - name: Gate on Critical/High severity (npm audit)
        working-directory: apps/${{ matrix.app }}
        run: npm audit --audit-level=high
