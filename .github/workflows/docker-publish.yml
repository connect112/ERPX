name: ERPX Build & Publish Images

# Runs only after CI has already passed on main (workflow_run trigger),
# or manually — never builds/pushes from an unvalidated commit.
on:
  workflow_run:
    workflows: ["ERPX CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/erpx-api:latest
            ghcr.io/${{ github.repository_owner }}/erpx-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image (production nginx build)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/erpx-web:latest
            ghcr.io/${{ github.repository_owner }}/erpx-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
