# Fluent Bit configuration — Docker Compose path.
#
# Log collection topology: every backend service (api, celery_worker,
# celery_beat, nginx) is switched to Docker's `fluentd` logging driver
# (docker-compose.yml), which pushes each log line to this container's
# `forward` input over the existing erpx_network bridge — no host
# filesystem log-file tailing needed on the Compose path (unlike the
# Kubernetes DaemonSet, which tails node-local log files since there's no
# single "Docker daemon" to push from in a multi-node cluster).
#
# Each record's `log` key holds the raw line the application wrote to
# stdout — JSON (from structlog) when ENVIRONMENT=production, or
# human-readable console text otherwise (see app/core/logging_config.py).
# The `parser` filter below only rewrites records that actually parse as
# JSON (`Reserve_Data On` keeps the raw line untouched otherwise), so this
# pipeline degrades gracefully instead of dropping non-JSON dev-mode logs.

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_PORT     2020

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

[FILTER]
    Name         parser
    Match        erpx.*
    Key_Name     log
    Parser       erpx_json
    Reserve_Data On
    Preserve_Key Off

# Pipeline-level sensitive-data redaction — see mask_sensitive_fields.lua
# for what this does and doesn't replace.
[FILTER]
    Name   lua
    Match  erpx.*
    script mask_sensitive_fields.lua
    call   mask_sensitive_fields

# Every record still carries its own `service`/`level`/`request_id`/
# `organization_id` keys from the unified logging schema (see
# docs/logging-architecture-proposal.md Section 6) — record_modifier just
# adds the two static, deployment-wide labels that schema doesn't (and
# shouldn't) carry per-line.
[FILTER]
    Name        record_modifier
    Match       erpx.*
    Record      job erpx
    Record      deployment compose

[OUTPUT]
    Name            loki
    Match           erpx.*
    Host            loki
    Port            3100
    Labels          job=erpx, deployment=compose
    Label_keys      $service,$level
    Line_format     json
    Auto_kubernetes_labels Off
