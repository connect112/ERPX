# Shared Fluent Bit parser definitions — mounted by the Docker Compose
# `fluent-bit` service; the Kubernetes DaemonSet's ConfigMap
# (infrastructure/kubernetes/fluent-bit-daemonset.yaml) embeds the same
# `erpx_json` parser inline since K8s ConfigMaps can't reference external
# files, but the parser logic itself is identical in both places.

[PARSER]
    Name        erpx_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# nginx's json_combined log_format (infrastructure/nginx/nginx.conf) is
# already valid JSON with its own "timestamp" field in the same
# %Y-%m-%dT%H:%M:%S%z (ISO 8601) shape structlog uses, via $time_iso8601 —
# reuses the same erpx_json parser above rather than defining a second,
# near-identical one.
