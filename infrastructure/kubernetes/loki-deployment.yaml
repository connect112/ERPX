# Grafana Loki — Deployment + Service + ConfigMap + a small PersistentVolumeClaim.
#
# The PVC is the one exception to this directory's own stated policy
# (infrastructure/kubernetes/README.md: "stateless application tier
# only... run stateful stuff as managed services, not StatefulSets on the
# same cluster"). It's included deliberately, not as an oversight: unlike
# Postgres/Redis/Elasticsearch, this PVC holds only the boltdb-shipper
# index cache — a rebuildable local cache, not the source of truth. Log
# *data* durability lives entirely in MinIO/S3 (already a managed-service-
# capable dependency per that same README), so losing this PVC loses
# nothing except query-cache warmth, not data. See
# docs/logging-architecture-proposal.md Section 4's "Reliability & Ops"
# for the full reasoning ("Loki itself is stateless (all durable state in
# object storage)").
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: erpx
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    ingester:
      chunk_idle_period: 30m
      chunk_target_size: 1048576
      max_chunk_age: 1h
      wal:
        enabled: true
        dir: /loki/wal

    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: aws
          schema: v11
          index:
            prefix: erpx_logs_index_
            period: 24h

    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        cache_location: /loki/boltdb-shipper-cache
        cache_ttl: 24h
      aws:
        endpoint: ${MINIO_ENDPOINT}
        bucketnames: ${MINIO_BUCKET_LOGS}
        access_key_id: ${MINIO_ACCESS_KEY}
        secret_access_key: ${MINIO_SECRET_KEY}
        s3forcepathstyle: true
        insecure: true

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: aws

    limits_config:
      retention_period: 720h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      max_label_names_per_series: 15

    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-index-cache
  namespace: erpx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: erpx
  labels:
    app: loki
spec:
  # Single replica to start (Section 4: "at ERPX's current scale, a single
  # replica is reasonable... a Loki restart causes a brief gap in
  # *querying*, not data loss"). Recreate, not RollingUpdate — two Loki
  # pods can't safely share the same ReadWriteOnce index-cache PVC.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3100"
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          args:
            - -config.file=/etc/loki/loki-config.yaml
            - -config.expand-env=true
          env:
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: erpx-config
                  key: MINIO_ENDPOINT
            - name: MINIO_BUCKET_LOGS
              value: "erpx-logs"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: erpx-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: erpx-secrets
                  key: MINIO_SECRET_KEY
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 9096
              name: grpc
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6 # Loki's own ingester has a documented ~15s "not ready" grace window after startup
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-index-cache
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: erpx
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      name: http
    - port: 9096
      targetPort: 9096
      name: grpc
  type: ClusterIP
