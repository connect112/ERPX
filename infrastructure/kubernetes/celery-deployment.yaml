apiVersion: apps/v1
kind: Deployment
metadata:
  name: erpx-celery-worker
  namespace: erpx
  labels:
    app: erpx-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erpx-celery-worker
  template:
    metadata:
      labels:
        app: erpx-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ghcr.io/gir-technologies/erpx-api:latest
          command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: erpx-config
            - secretRef:
                name: erpx-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["celery", "-A", "app.core.celery_app", "inspect", "ping", "-d", "celery@$(HOSTNAME)"]
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erpx-celery-beat
  namespace: erpx
  labels:
    app: erpx-celery-beat
spec:
  # Exactly one replica — Celery beat is a scheduler; running more than one
  # would fire every scheduled task (overdue invoices, payroll depreciation
  # reminders, scheduled report emails) multiple times.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: erpx-celery-beat
  template:
    metadata:
      labels:
        app: erpx-celery-beat
    spec:
      containers:
        - name: celery-beat
          image: ghcr.io/gir-technologies/erpx-api:latest
          command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: erpx-config
            - secretRef:
                name: erpx-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
