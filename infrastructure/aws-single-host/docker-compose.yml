# Shared infrastructure for the single-host AWS deploy — see README.md.
# Postgres and Redis here are shared by both apps' own docker-compose.prod.yml
# (in the erpx and pentrix checkouts respectively), joined via the external
# `webnet` network this file creates. Caddy is the only thing bound to
# 80/443 on the host.
name: infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: shared_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      ERPX_DB_PASSWORD: ${ERPX_DB_PASSWORD}
      PENTRIX_DB_PASSWORD: ${PENTRIX_DB_PASSWORD}
    volumes:
      - infra_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webnet

  redis:
    image: redis:7-alpine
    container_name: shared_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # The healthcheck's "$$REDIS_PASSWORD" is a container-shell env var
    # reference, resolved by CMD-SHELL inside the container at check time —
    # separate from the "${REDIS_PASSWORD}" above, which compose substitutes
    # into the command list from the host-side .env before the container
    # ever starts. Without also setting it here, the healthcheck's shell
    # sees an empty REDIS_PASSWORD and every check fails with WRONGPASS.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - infra_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webnet

  caddy:
    image: caddy:2-alpine
    container_name: shared_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - webnet

networks:
  webnet:
    name: webnet
    driver: bridge

volumes:
  infra_postgres_data:
  infra_redis_data:
  caddy_data:
  caddy_config:
