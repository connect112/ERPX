events {
    worker_connections 1024;
}

http {
    # Unified JSON schema (docs/logging-architecture-proposal.md Section 3) —
    # request_id comes from $upstream_http_x_request_id, the API's own
    # X-Request-ID response header (set by RequestContextMiddleware), so
    # nginx access logs correlate with the API/Celery JSON logs they front.
    map $status $loglevel {
        ~^5    error;
        ~^4    warning;
        default info;
    }

    log_format json_combined escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"level":"$loglevel",'
            '"message":"http_request",'
            '"service":"erpx-nginx",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"status":$status,'
            '"request_time":$request_time,'
            '"request_id":"$upstream_http_x_request_id",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    upstream erpx_api {
        server api:8000;
    }

    upstream erpx_web {
        server web:5173;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        location /api/ {
            proxy_pass http://erpx_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://erpx_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
