# Serves the built React SPA with client-side routing support (React
# Router): any path that doesn't match a real static file falls back to
# index.html so deep links (e.g. /crm/leads/123) work on a hard refresh.

# nginx's own MIME table has no entry for .mjs, so such a file would be sent as application/octet-stream, which browsers refuse for
# scripts and workers. (Declared at http level, outside the server block, so it adds to the standard table instead of replacing it.)
# The app bundles its pdf.js worker as an ordinary .js file; this keeps any .mjs file a library might ship from failing silently.
types {
    application/javascript mjs;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Public legal pages are plain HTML files (no JavaScript needed to read them), for crawlers and review tools.
    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /data-deletion {
        try_files /data-deletion.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite output) are safe to cache aggressively;
    # index.html itself must always be revalidated so deploys take effect.
    location ~* \.(?:m?js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
