# Test gate (./staging.sh gate on): the checkout return page (/internship-onboarding?order=...) is answered by the
# gateway, so the web app never loads there and never sends its automatic status check (POST .../payments/refresh).
# Opening the same page WITHOUT ?order= works as usual, which is where the "I have paid: check status" button is.
# Staging gateway only; the web app and the API are unchanged.
set $staging_gate_return "";
if ($uri ~ "^/internship-onboarding/?$") { set $staging_gate_return "R"; }
if ($arg_order != "") { set $staging_gate_return "${staging_gate_return}O"; }
if ($staging_gate_return = "RO") { rewrite ^ /__staging_gate_return last; }

location = /__staging_gate_return {
    internal;
    default_type text/html;
    return 200 "<!doctype html><meta charset=utf-8><title>Staging test gate</title><p style='font:16px sans-serif;max-width:40em;margin:3em auto'><b>Staging test gate is on.</b> The payment return page is blocked on purpose so the automatic payment check does not run. Open the student's onboarding link without <code>?order=...</code> and press <i>I have paid: check status</i>.</p>";
}
