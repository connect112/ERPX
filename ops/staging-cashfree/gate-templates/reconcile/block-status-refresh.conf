# Reconciliation test (./staging.sh recon on): the student's status-check endpoint (POST .../payments/refresh, which the
# "I have paid: check status" button and the return page call) answers 503 at the gateway, so no student-side check can
# reach ERPX and contaminate the test. Attempts are still counted from the gateway log. Staging gateway only; the
# reconciliation task runs in the worker and talks to Cashfree directly, so it is not affected.
if ($uri = /api/v1/public/internship-onboarding/payments/refresh) { return 503; }
