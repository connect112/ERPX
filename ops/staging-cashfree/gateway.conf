# The only way into the staging stack: published on 127.0.0.1, and reached by the Cloudflare tunnel inside Docker.
# It serves exactly what the sandbox run needs, like production's Caddy for erp.pentrix.in:
#   /api/      the ERPX API (staff screens, student page, Cashfree webhook)
#   /_files/   short-lived signed links to object storage
#   /          the ERPX web app (static production build)
# Everything else of the internal services (Postgres, Redis, MinIO console, Mailpit, Celery) is not reachable here.

server_tokens off;

upstream staging_api { server api:8000; }
upstream staging_web { server web:80; }
upstream staging_storage { server minio:9000; }

# Signed storage links must reach MinIO byte for byte (path and query exactly as signed). A named capture in a map is
# copied as-is; numbered captures ($1 in "if"/"rewrite") would be re-escaped (%20 -> %2520) and break the signature.
map $request_uri $signed_storage_uri {
    "~^/_files(?<signed_rest>/.*)$" $signed_rest;
    default "";
}

# the tunnel sends X-Forwarded-Proto: https; local requests are plain http
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # not part of the sandbox run: interactive API documentation and metrics
    location ~ ^/api/(docs|redoc|openapi\.json) { return 404; }
    location = /metrics { return 404; }

    location /api/ {
        proxy_pass http://staging_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Signed storage links: pass the path and query exactly as signed (no decoding), with the Host the API signed for.
    location /_files/ {
        proxy_pass http://staging_storage$signed_storage_uri;
        proxy_set_header Host minio:9000;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://staging_web;
        proxy_set_header Host $host;
    }
}
