x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-erpx}:${POSTGRES_PASSWORD:-erpx_secret}@postgres:5432/${POSTGRES_DB:-erpx}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-erpx_minio}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-erpx_minio_secret}
  MINIO_SECURE: "false"
  ELASTICSEARCH_URL: http://elasticsearch:9200
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production_min_32_chars}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 15
  REFRESH_TOKEN_EXPIRE_DAYS: 7
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
  SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@erpx.example.com}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ERPX}
  SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
  SMS_SENDER_ID: ${SMS_SENDER_ID:-ERPXTX}
  WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  AI_PROVIDER: ${AI_PROVIDER:-anthropic}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.anthropic.com}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-5}

services:
  postgres:
    image: postgres:16-alpine
    container_name: erpx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erpx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erpx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-erpx}
    ports:
      - "5432:5432"
    volumes:
      - erpx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erpx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erpx_network

  redis:
    image: redis:7-alpine
    container_name: erpx_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - erpx_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erpx_network

  minio:
    image: minio/minio:latest
    container_name: erpx_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erpx_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erpx_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - erpx_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erpx_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: erpx_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - erpx_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erpx_network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: erpx_api
    restart: unless-stopped
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./modules:/app/modules
      - ./packages:/app/packages
    networks:
      - erpx_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: erpx_celery_worker
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      - api
      - redis
    volumes:
      - ./apps/api:/app
      - ./modules:/app/modules
      - ./packages:/app/packages
    networks:
      - erpx_network
    # `python -m celery` (not bare `celery`) so the working directory is
    # added to sys.path — matching how uvicorn resolves `app.main` for the
    # `api` service — otherwise autodiscover_tasks() can't find `modules.*`.
    command: python -m celery -A app.core.celery_app worker --loglevel=info
    # Override the image's HEALTHCHECK (curls the API's HTTP port, which
    # this container doesn't serve) with a real worker-responsiveness check.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  celery_beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: erpx_celery_beat
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      - api
      - redis
    volumes:
      - ./apps/api:/app
      - ./modules:/app/modules
      - ./packages:/app/packages
    networks:
      - erpx_network
    command: python -m celery -A app.core.celery_app beat --loglevel=info
    # Override the image's HEALTHCHECK (curls the API's HTTP port, which
    # this container doesn't serve). Beat has no built-in ping the way a
    # worker does, so this just disables the inherited, always-failing check
    # rather than reporting a false "unhealthy".
    healthcheck:
      disable: true

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: erpx_web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    networks:
      - erpx_network
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:alpine
    container_name: erpx_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - erpx_network

  # ---------------------------------------------------------------------
  # Monitoring stack — opt-in via `docker compose --profile monitoring up`
  # so a plain `docker compose up` for local dev stays lightweight.
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: erpx_prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - erpx_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - erpx_network

  grafana:
    image: grafana/grafana:latest
    container_name: erpx_grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
    volumes:
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - erpx_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - erpx_network

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: erpx_postgres_exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-erpx}:${POSTGRES_PASSWORD:-erpx_secret}@postgres:5432/${POSTGRES_DB:-erpx}?sslmode=disable
    depends_on:
      - postgres
    networks:
      - erpx_network

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: erpx_redis_exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    networks:
      - erpx_network

  # ---------------------------------------------------------------------
  # Log shipping (Loki + Fluent Bit) — also opt-in via `--profile monitoring`.
  # Reuses MinIO as Loki's object store rather than adding a new storage
  # system (see docs/logging-architecture-proposal.md Section 3). Service
  # log collection itself is wired via docker-compose.monitoring.yml (an
  # override file, not this base file) so the `fluentd` logging driver —
  # which replaces `docker logs`/`docker compose logs` for whichever
  # services use it — is never applied unless monitoring is explicitly
  # requested with both files. See infrastructure/monitoring/README.md.
  # ---------------------------------------------------------------------
  loki-bucket-init:
    image: minio/mc:latest
    container_name: erpx_loki_bucket_init
    profiles: ["monitoring"]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set erpx_minio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing erpx_minio/${MINIO_BUCKET_LOGS:-erpx-logs}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-erpx_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-erpx_minio_secret}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - erpx_network

  loki:
    image: grafana/loki:2.9.8
    container_name: erpx_loki
    restart: unless-stopped
    profiles: ["monitoring"]
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-erpx_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-erpx_minio_secret}
      MINIO_BUCKET_LOGS: ${MINIO_BUCKET_LOGS:-erpx-logs}
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - erpx_loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      loki-bucket-init:
        condition: service_completed_successfully
    networks:
      - erpx_network

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    container_name: erpx_fluent_bit
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./infrastructure/monitoring/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infrastructure/monitoring/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./infrastructure/monitoring/fluent-bit/mask_sensitive_fields.lua:/fluent-bit/etc/mask_sensitive_fields.lua:ro
    ports:
      - "24224:24224" # forward input — Docker's fluentd logging driver targets this
      - "2020:2020" # Fluent Bit's own HTTP health/metrics endpoint
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:2020/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - erpx_network

networks:
  erpx_network:
    driver: bridge

volumes:
  erpx_postgres_data:
  erpx_redis_data:
  erpx_minio_data:
  erpx_es_data:
  erpx_prometheus_data:
  erpx_grafana_data:
  erpx_loki_data:
