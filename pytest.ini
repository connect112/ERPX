[pytest]
minversion = 7.0
testpaths = tests
pythonpath = apps/api .
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: pure-logic tests with no database or network access
    api: end-to-end tests against the FastAPI app via httpx
    integration: tests exercising multiple modules together (e.g. Accounting posting)
    security: tests asserting a specific security control holds
    performance: latency-regression tests asserting response-time budgets
